<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Verve — Health, all in one place</title>
<!-- PWA / "installed as an app" essentials. If you're wrapping this file with a
     WebView-to-app tool, keep manifest.json and sw.js in the same folder as
     index.html — several wrapper tools look for a manifest to treat the site
     as installable, and the service worker lets already-loaded assets keep
     working on a flaky connection instead of showing a blank screen. -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#161A22" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Verve" />
<style>
  html, body { margin:0; padding:0; min-height:100vh; background:#EFE8D8; }
  #root { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 0; }
  @media (max-width:460px){ #root{ padding:0; } }
  #load-fallback { max-width:340px; margin:0 auto; padding:24px; font:15px/1.5 system-ui,sans-serif; color:#5b4636; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  #load-fallback .lf-logo { width:52px; height:52px; border-radius:15px; background:linear-gradient(155deg,#1B2027,#0D1015); box-shadow: inset 0 0 0 1px rgba(201,163,92,0.4); display:flex; align-items:center; justify-content:center; }
  #load-fallback .lf-bar { width:120px; height:4px; border-radius:4px; background:rgba(91,70,54,0.15); overflow:hidden; }
  #load-fallback .lf-bar-fill { height:100%; width:40%; background:#C9A35C; border-radius:4px; animation: lfSlide 1.1s ease-in-out infinite; }
  @keyframes lfSlide { 0%{ margin-left:-40%; } 100%{ margin-left:100%; } }
  #load-fallback .lf-retry { display:none; background:#161A22; color:#fff; border:none; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
  #load-fallback.lf-failed .lf-bar { display:none; }
  #load-fallback.lf-failed .lf-retry { display:inline-block; }
</style>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://js.stripe.com/v3/"></script>
</head>

<div id="root">
  <div id="load-fallback">
    <div class="lf-logo"><svg width="30" height="30" viewBox="0 0 32 32" fill="none"><ellipse cx="19.8" cy="6.6" rx="2.5" ry="5" fill="#C9A35C" transform="rotate(34 19.8 6.6)"/><ellipse cx="16.3" cy="5" rx="2.1" ry="4.4" fill="#F5F0E3" fill-opacity="0.92" transform="rotate(-10 16.3 5)"/><rect x="6.5" y="14.5" width="19" height="9" rx="4.5" transform="rotate(-32 16 19)" fill="#F5F0E3"/><rect x="6.5" y="14.5" width="9.4" height="9" rx="4.5" transform="rotate(-32 16 19)" fill="#C9A35C"/><rect x="6.5" y="14.5" width="19" height="9" rx="4.5" transform="rotate(-32 16 19)" fill="none" stroke="rgba(15,18,24,0.22)" stroke-width="0.6"/></svg></div>
    <span id="lf-text">Loading Verve…</span>
    <div class="lf-bar"><div class="lf-bar-fill"></div></div>
    <button class="lf-retry" onclick="window.location.reload()">Retry</button>
  </div>
</div>
<script>
  // If React hasn't shown up within a few seconds, something failed to load —
  // almost always a blocked network request when this file is wrapped into a
  // native app (the wrapper's WebView needs to allow requests to jsdelivr.net,
  // gstatic.com, firestore.googleapis.com, and api.groq.com). Show that plainly
  // instead of leaving a blank screen, and offer a one-tap retry.
  setTimeout(function () {
    if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
      var wrap = document.getElementById("load-fallback");
      var text = document.getElementById("lf-text");
      if (wrap && text) {
        wrap.classList.add("lf-failed");
        text.textContent = "Couldn't load required app resources. If this is wrapped as an app, make sure it can reach jsdelivr.net, gstatic.com, and api.groq.com. Otherwise, try a different network or disable ad-blockers/VPN for this site.";
      }
    }
  }, 4000);
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        // Not fatal — the app still works without offline caching, this just
        // means repeat loads won't be as resilient on a flaky connection.
      });
    });
  }
</script>

      .slot-card-body { padding:0 14px 16px; border-top:1px solid var(--hairline); }
      .form-label { display:block; font-size:11px; font-weight:600; color: var(--ink-soft); margin: 12px 0 5px; text-transform:uppercase; letter-spacing:0.06em; }
      .form-input { width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--slate-100); font-size:13.5px; color: var(--ink); background:#fff; font-family: var(--font-care-ui); }
      .form-input:focus { outline:none; border-color: var(--amber); }
      .day-chips { display:flex; gap:5px; flex-wrap:wrap; }
      .day-chip { width:30px; height:30px; border-radius:8px; border:1px solid var(--slate-100); background:#fff; font-size:11px; color: var(--ink-soft); cursor:pointer; }
      .day-chip.on { background: var(--ink); color: var(--amber-soft); border-color: var(--ink); }
      .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .slot-card-actions { display:flex; align-items:center; gap:8px; margin-top:14px; }
      .toggle-caption { font-size:12px; color: var(--ink-soft); margin-right:auto; }
      .mini-btn { display:inline-flex; align-items:center; gap:5px; background: var(--amber-soft); color:#6B5222; border:none;
        padding:7px 12px; border-radius:9px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
      .mini-btn--muted { background: var(--slate-100); color: var(--ink-soft); }
      .toggle { width:38px; height:22px; border-radius:999px; background: var(--slate-100); border:none; position:relative; cursor:pointer; flex-shrink:0; }
      .toggle-on { background: var(--sage); }
      .toggle-knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition: left .15s; }
      .toggle-on .toggle-knob { left:18px; }

      /* log */
      .range-row { display:flex; gap:8px; margin-bottom:14px; }
      .range-btn { background:#fff; border:1px solid var(--slate-100); padding:6px 14px; border-radius:999px; font-size:12.5px; color: var(--ink-soft); cursor:pointer; }
      .range-btn.active { background: var(--ink); color: var(--amber-soft); border-color: var(--ink); }
      .mono { font-family: var(--font-care-mono); }
      .log-card { background:#fff; border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin-bottom:9px; }
      .log-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
      .log-date { font-size:11.5px; color: var(--ink-soft); }
      .log-name { font-size:14px; font-weight:600; color: var(--ink); }
      .log-time { font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
      .log-actions { display:flex; gap:8px; margin-top:10px; }

      /* contacts */
      .contact-card { margin-bottom:10px; }
      .btn-primary { width:100%; background: linear-gradient(155deg, #C6A369, var(--amber)); color:#1B1608; border:none; padding:13px 16px; border-radius:11px;
        font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; box-shadow: 0 8px 20px rgba(173,138,77,0.28); }
      .btn-primary:disabled { background: var(--slate-100); color: var(--ink-soft); cursor:not-allowed; box-shadow:none; }

      /* settings */
      .setting-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--hairline); gap:12px; }
      .setting-row:last-child { border-bottom:none; }
      .setting-title { font-size:13.5px; font-weight:600; color: var(--ink); }
      .setting-sub { font-size:11.5px; color: var(--ink-soft); }
      .danger-btn { margin-top:10px; background: var(--clay); color:#fff; border:none; padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; }

      /* elderly \u2014 background gradient set inline per time of day on .app-frame */
      .elder-content { flex:1; overflow-y:auto; padding: 26px 22px; display:flex; flex-direction:column; align-items:center;
        justify-content:space-between; text-align:center; position:relative; font-family: var(--font-elder-body);
        transition: color .8s ease; }
      .elder-switch { position:absolute; top:14px; right:14px; background: rgba(255,255,255,0.55); border:1px solid rgba(22,26,34,0.12);
        width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:15px; color: var(--ink-soft); backdrop-filter: blur(6px); }
      .elder-top { display:flex; flex-direction:column; align-items:center; gap:2px; }
      .elder-greeting { display:flex; align-items:center; gap:8px; color: var(--ink-soft); font-size:16px; margin-bottom:2px; }
      .elder-clock { font-family: var(--font-elder-display); font-optical-sizing:auto; font-weight:600; font-size:clamp(42px,14vw,62px); color: var(--ink); line-height:1; }
      .elder-date { font-size:15px; color: var(--ink-soft); }
      .elder-card { background:#fff; border-radius:18px; padding:22px 28px; width:100%; border:1px solid var(--gold-line);
        box-shadow: 0 18px 40px rgba(22,26,34,0.10); display:flex; flex-direction:column; align-items:center; gap:5px; transition: box-shadow .8s ease; }
      .elder-card-label { font-size:13px; color: var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
      .elder-card-name { display:flex; align-items:center; gap:9px; font-family: var(--font-elder-display); font-size:23px; font-weight:600; color: var(--ink); text-align:center; }
      .elder-card-time { font-size:20px; color: var(--amber); font-weight:700; }
      .elder-help-btn { display:flex; align-items:center; gap:9px; background: var(--ink); color:#fff; border:none;
        padding:15px 26px; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; font-family: var(--font-elder-body);
        min-height:52px; box-sizing:border-box; line-height:1.25; text-align:center; box-shadow: 0 10px 26px rgba(22,26,34,0.28); }

      .elder-content--night { --ink:#F1EFE6; --ink-soft:#B4AC98; }
      .elder-content--night .elder-switch { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.18); }
      .elder-content--night .elder-card { box-shadow: 0 0 46px rgba(173,138,77,0.16), 0 14px 34px rgba(0,0,0,0.4); border-color: rgba(201,163,92,0.3); }
      .elder-content--night .elder-help-btn { background:#F1EFE6; color:#161A22; }

      .elder-overlay { position:absolute; inset:0; background: rgba(15,18,24,0.62); display:flex; align-items:center;
        justify-content:center; z-index:1000; padding:20px; backdrop-filter: blur(3px); border-radius:20px; }
      .elder-overlay-card { background:#fff; border-radius:20px; padding:32px 26px; width:100%;
        display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; border:1px solid var(--gold-line);
        box-shadow: 0 30px 70px rgba(0,0,0,0.34); animation: pop .25s ease; }
      @keyframes pop { from { transform: scale(0.92); opacity:0; } to { transform: scale(1); opacity:1; } }
      .elder-pill-icon { width:78px; height:78px; border-radius:50%; background: linear-gradient(155deg, #C6A369, var(--amber)); display:flex;
        align-items:center; justify-content:center; margin-bottom:4px; animation: pulse 1.6s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(173,138,77,0.35); } 50% { box-shadow: 0 0 0 14px rgba(173,138,77,0); } }
      .elder-overlay-title { font-family: var(--font-elder-display); font-weight:600; font-size:20px; color: var(--ink); }
      .elder-overlay-name { font-size:25px; font-weight:700; color: var(--ink); }
      .elder-overlay-dose { font-size:15px; color: var(--ink-soft); }
      .elder-help-text { font-size:16px; color: var(--ink-soft); margin: 3px 0; }
      .elder-help-name { font-size:16px; color: var(--ink); font-weight:700; }
      .elder-help-phone { font-family: var(--font-care-mono); font-size:19px; color: var(--ink); font-weight:600; }
      .elder-take-btn { margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
        background: var(--sage); color:#fff; border:none; padding:16px; border-radius:14px; font-size:18px;
        font-weight:700; cursor:pointer; font-family: var(--font-elder-body); box-shadow: 0 10px 24px rgba(62,107,84,0.3); }
      .elder-snooze-btn { background:none; border:none; color: var(--ink-soft); font-size:14px; text-decoration:underline; cursor:pointer; margin-top:2px; font-family: var(--font-elder-body); }

      /* elder quick-action row */
      .elder-quick-row { display:flex; flex-wrap:wrap; gap:10px; width:100%; margin-top:2px; }
      .elder-quick-btn { flex:1 1 40%; display:flex; flex-direction:column; align-items:center; gap:6px; background: rgba(255,255,255,0.72);
        border:1px solid rgba(22,26,34,0.1); color: var(--ink); padding:12px 6px; border-radius:14px; font-size:12px; font-weight:700;
        cursor:pointer; font-family: var(--font-elder-body); text-decoration:none; backdrop-filter: blur(6px);
        min-height:72px; box-sizing:border-box; justify-content:center; line-height:1.25; text-align:center; word-break:break-word; }
      .elder-content--night .elder-quick-btn { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); }
      .elder-message-card { max-width: 340px; width:100%; }

      /* boot bar */
      .boot-bar { width:120px; height:4px; border-radius:4px; background: var(--slate-100); overflow:hidden; margin-top:4px; }
      .boot-bar-fill { height:100%; width:40%; background: var(--amber); border-radius:4px; animation: bootSlide 1.1s ease-in-out infinite; }
      @keyframes bootSlide { 0%{ margin-left:-40%; } 100%{ margin-left:100%; } }

      /* floating AI chat button */
      .fab-chat { position:absolute; right:16px; bottom:78px; width:48px; height:48px; border-radius:50%;
        background: linear-gradient(155deg, #20242D, #0D1015); color: var(--amber); border:1px solid var(--gold-line); display:flex; align-items:center;
        justify-content:center; box-shadow: 0 12px 26px rgba(0,0,0,0.3); cursor:pointer; z-index: 40; }

      /* messages */
      .msg-wrap { display:flex; flex-direction:column; height:340px; }
      .msg-wrap--big { height:280px; }
      .msg-list { flex:1; overflow-y:auto; padding:4px 2px; display:flex; flex-direction:column; gap:8px; }
      .msg-bubble { max-width:78%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.35; }
      .msg-bubble--them { align-self:flex-start; background: var(--slate-100); color: var(--ink); border-bottom-left-radius:4px; }
      .msg-bubble--me { align-self:flex-end; background: var(--ink); color: var(--amber-soft); border-bottom-right-radius:4px; }
      .msg-bubble-time { font-size:10px; opacity:0.65; margin-top:3px; }
      .msg-input-row { display:flex; gap:8px; margin-top:6px; }
      .msg-input { flex:1; }
      .msg-send-btn { width:40px; height:40px; border-radius:12px; border:none; background: var(--ink); color: var(--amber); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

      /* modal (chat, scan, and any future full-screen tool) \u2014 covers the whole
         viewport rather than a small bottom-sheet popup, on every screen size */
      .modal-overlay { position:fixed; inset:0; background: var(--cream); display:flex; align-items:stretch;
        justify-content:center; z-index:1100; }
      .modal-card { background: var(--cream); width:100%; max-width:560px; margin:0 auto;
        padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
        height:100%; max-height:100%; border-radius:0; display:flex; flex-direction:column;
        box-shadow:none; animation: modalIn .18s ease; }
      @keyframes modalIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
      .modal-card--big-text .msg-bubble { font-size:16px; }
      .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--hairline); flex-shrink:0; }
      .modal-header-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; color: var(--ink); font-family: var(--font-elder-display); letter-spacing:0.01em; }
      .modal-chat-list { flex:1; min-height:0; }
      .chat-error { font-size:12px; color:#8A3B2E; background:#FCEEE9; border:1px solid var(--clay-soft); border-radius:10px; padding:8px 10px; margin-top:6px; }

      /* scan */
      .scan-cta { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background: var(--teal-soft); color: var(--teal);
        border:1px solid var(--hairline); padding:11px; border-radius:11px; font-weight:700; font-size:13px; cursor:pointer; margin-bottom:14px; }
      .scan-body { display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
      .scan-drop { display:flex; flex-direction:column; align-items:center; gap:10px; padding:30px 16px; border:2px dashed var(--gold-line);
        border-radius:14px; background: var(--slate-50); color: var(--ink-soft); font-size:13px; cursor:pointer; text-align:center; }
      .scan-preview { width:100%; max-height:220px; object-fit:cover; border-radius:14px; }
      .scan-suggestion { display:flex; flex-direction:column; }

      /* setup / onboarding */
      .setup-scroll { flex:1; overflow-y:auto; padding:30px 22px 26px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;
        background: linear-gradient(180deg, #E9E1CD 0%, #EFE9D8 45%, var(--cream) 100%); }
      .setup-step { width:100%; text-align:left; margin-top:18px; }
      .setup-step-title { font-family: var(--font-elder-display); font-weight:600; font-size:17px; color: var(--ink); text-align:center; }
      .setup-step-sub { font-size:12.5px; color: var(--ink-soft); text-align:center; margin:4px 0 16px; }
      .setup-nav { display:flex; gap:10px; margin-top:16px; }
      .setup-nav .btn-primary { flex:1; }
      .lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .lang-card { background:#fff; border:1px solid var(--slate-100); border-radius:12px; padding:12px 8px; display:flex;
        flex-direction:column; align-items:center; gap:2px; cursor:pointer; min-height:64px; justify-content:center;
        box-sizing:border-box; text-align:center; }
      .lang-card.on { border-color: var(--amber); background: var(--amber-soft); }
      .lang-native { font-size:15px; font-weight:700; color: var(--ink); }
      .lang-label { font-size:11px; color: var(--ink-soft); }
      .lang-note { font-size:9.5px; color: var(--ink-soft); opacity:0.75; }
      .link-code-box { background:#fff; border:1px solid var(--slate-100); border-radius:14px; padding:18px; text-align:center; }
      .link-code-digits { font-family: var(--font-care-mono); font-size:34px; font-weight:700; letter-spacing:0.12em; color: var(--ink); margin-top:4px; }
      .link-code-input { text-align:center; font-family: var(--font-care-mono); font-size:24px; letter-spacing:0.2em; padding:14px; }

      .pillpal-root--dyslexia, .pillpal-root--dyslexia input, .pillpal-root--dyslexia textarea, .pillpal-root--dyslexia select, .pillpal-root--dyslexia button {
        font-family: 'Verdana', 'Tahoma', 'Trebuchet MS', sans-serif !important; letter-spacing: 0.02em; line-height: 1.6; word-spacing: 0.06em;
      }
      .pillpal-root--large { font-size: 1.12em; }
      .pillpal-root--large .section-title { font-size: 1.15em; }
      .pillpal-root--large .elder-time { font-size: 3.2rem; }
      .pillpal-root--large .elder-overlay-name { font-size: 1.35em; }
      .pillpal-root--dark { --cream:#1A1D24; --cream-2:#242830; --ink:#F2EDE4; --ink-soft:#A8ADB8; --slate-50:#22262E; --slate-100:#2E333C; --hairline:rgba(255,255,255,0.08); }
      .pillpal-root--dark .app-frame { background: var(--cream); }
      .pillpal-root--dark .card { background: var(--slate-50); border-color: var(--hairline); }
      .pillpal-root--dark .setup-scroll { background: linear-gradient(180deg, #1E2229 0%, #1A1D24 100%); }
      .pill-photo-thumb { width:56px; height:56px; object-fit:cover; border-radius:10px; border:1px solid var(--hairline); }
      .pill-photo-elder { width:72px; height:72px; object-fit:cover; border-radius:14px; border:2px solid rgba(255,255,255,0.2); }
      .pill-photo-alert { width:80px; height:80px; object-fit:cover; border-radius:16px; margin:0 auto 10px; display:block; }
      .pill-photo-row { display:flex; align-items:center; gap:10px; margin-top:6px; }
      .elder-card--compact { padding:14px 16px; }

      /* ---------- new splash screen ---------- */
      .splash-frame { align-items:center; justify-content:center; gap:16px; background: radial-gradient(120% 100% at 50% 0%, #1E232B 0%, #12151C 60%, #0B0D12 100%); }
      .splash-ring-wrap { position:relative; width:104px; height:104px; display:flex; align-items:center; justify-content:center; }
      .splash-ring { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(173,138,77,0.35); animation: splashPulse 2.2s ease-out infinite; }
      .splash-ring.r2 { animation-delay: .7s; }
      .splash-ring.r3 { animation-delay: 1.4s; }
      @keyframes splashPulse { 0% { transform:scale(0.55); opacity:0.9; } 100% { transform:scale(1.55); opacity:0; } }
      .splash-logo { position:relative; z-index:2; animation: splashBob 2.6s ease-in-out infinite; }
      @keyframes splashBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .splash-brand { font-family: var(--font-elder-display); font-weight:700; font-size:26px; letter-spacing:0.02em;
        background: linear-gradient(120deg, #F2E4C4, #C9A35C 55%, #F2E4C4); -webkit-background-clip:text; background-clip:text; color:transparent;
        background-size:200% 100%; animation: splashShine 2.6s linear infinite; margin-top:4px; }
      @keyframes splashShine { 0% { background-position:0% 0; } 100% { background-position:200% 0; } }
      .splash-caption { font-size:13px; color:rgba(255,255,255,0.55); min-height:18px; letter-spacing:0.01em; transition: opacity .3s ease; }
      .splash-dots { display:flex; gap:6px; margin-top:2px; }
      .splash-dot { width:6px; height:6px; border-radius:50%; background: rgba(173,138,77,0.9); animation: splashDot 1.2s ease-in-out infinite; }
      .splash-dot:nth-child(2) { animation-delay: .15s; }
      .splash-dot:nth-child(3) { animation-delay: .3s; }
      @keyframes splashDot { 0%,80%,100% { transform: translateY(0); opacity:0.4; } 40% { transform: translateY(-5px); opacity:1; } }

      /* ---------- shared animation helpers ---------- */
      @keyframes fadeSlideUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
      .anim-in { animation: fadeSlideUp .35s ease both; }
      .anim-in-1 { animation-delay: .04s; } .anim-in-2 { animation-delay: .09s; } .anim-in-3 { animation-delay: .14s; }
      .anim-in-4 { animation-delay: .19s; } .anim-in-5 { animation-delay: .24s; } .anim-in-6 { animation-delay: .29s; }
      @keyframes popIn { from { opacity:0; transform: scale(0.85); } to { opacity:1; transform: scale(1); } }
      .app-content { animation: fadeSlideUp .28s ease both; }
      .tabbar-item { transition: color .2s ease, transform .15s ease; }
      .tabbar-item.active { transform: translateY(-1px); }
      .tabbar-item:active { transform: scale(0.9); }
      .icon-btn, .fab-chat, .quick-tile, .health-cta { transition: transform .15s ease, box-shadow .15s ease; }
      .icon-btn:active, .fab-chat:active, .quick-tile:active, .health-cta:active { transform: scale(0.93); }

      /* ---------- health dashboard cards ---------- */
      .health-hero { border-radius:18px; padding:16px; color:#fff; position:relative; overflow:hidden; margin-bottom:14px; }
      .health-hero::after { content:""; position:absolute; inset:0; background: radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,0.18), transparent 60%); }
      .health-hero-row { display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative; z-index:1; }
      .health-hero-label { font-size:12px; opacity:0.85; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
      .health-hero-num { font-family: var(--font-elder-display); font-size:32px; font-weight:700; line-height:1.1; margin-top:2px; }
      .health-hero-sub { font-size:12.5px; opacity:0.85; margin-top:2px; }
      .quick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:12px 0; }
      .quick-tile { display:flex; flex-direction:column; align-items:center; gap:6px; background:#fff; border:1px solid var(--hairline);
        border-radius:14px; padding:12px 6px; cursor:pointer; font-family: var(--font-care-ui); }
      .quick-tile-icon { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
      .quick-tile-num { font-weight:700; font-size:14px; color: var(--ink); }
      .quick-tile-label { font-size:10.5px; color: var(--ink-soft); }

      /* step ring */
      .ring-card { display:flex; align-items:center; gap:16px; }
      .ring-wrap { position:relative; width:118px; height:118px; flex-shrink:0; }
      .ring-wrap svg { transform: rotate(-90deg); width:100%; height:100%; }
      .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .ring-center-num { font-family: var(--font-elder-display); font-weight:700; font-size:20px; color: var(--ink); }
      .ring-center-label { font-size:10px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; }
      .ring-track { fill:none; stroke: var(--slate-100); stroke-width:9; }
      .ring-fill { fill:none; stroke-width:9; stroke-linecap:round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
      .stat-list { flex:1; display:flex; flex-direction:column; gap:8px; }
      .stat-row { display:flex; align-items:center; justify-content:space-between; font-size:13px; }
